name: Build Firmware

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README*'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

env:
  IDF_PATH: /tmp/esp-idf

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Python & cmake
        run: pip install cmake==3.28.1

      - name: Clone ESP-IDF
        run: |
          git clone --depth 1 --branch v5.5.4 https://github.com/espressif/esp-idf.git "$IDF_PATH"

      - name: Install ESP-IDF tools
        run: |
          bash "$IDF_PATH/install.sh" esp32s3
          . "$IDF_PATH/export.sh"
          cmake --version

      - name: Build firmware
        run: |
          . "$IDF_PATH/export.sh"
          idf.py build

      - name: Commit build artifacts
        run: |
          mkdir -p firmware
          cp build/bootloader/bootloader.bin firmware/
          cp build/partition_table/partition-table.bin firmware/
          cp build/*.bin firmware/
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add firmware/
          git diff --cached --quiet || git commit -m "ci: rebuild $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push origin main
